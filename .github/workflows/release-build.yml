name: Release artifact build

on:
  workflow_dispatch:
  push:
    branches:
      - restore-cloudflare-release-path
      - nexapos-1.0.12-safety
    paths:
      - 'lib/**'
      - 'android/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'docs/release-*.md'
      - '.github/workflows/release-build.yml'

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml | head -n 1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  android-release:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get
      - run: flutter build apk --release --no-pub

      - name: Verify Android release SHA-256
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          wc -c build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NexaPOS-Android-${{ needs.metadata.outputs.version }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows-release:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - name: Build Windows release
        run: flutter build windows --release --no-pub
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      - name: Package Windows runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'NexaPOS-Windows-runtime.zip'
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath $runtime -Force
          "RUNTIME_ZIP=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build compact Windows installer
        shell: pwsh
        run: |
          $version = "${{ needs.metadata.outputs.version }}"
          $parts = $version.Split('.')
          $assemblyVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          $assemblyInfo = Join-Path $env:RUNNER_TEMP 'SetupVersion.cs'
          @"
          using System.Reflection;
          [assembly: AssemblyVersion("$assemblyVersion")]
          [assembly: AssemblyFileVersion("$assemblyVersion")]
          "@ | Set-Content -Path $assemblyInfo -Encoding ascii

          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (!(Test-Path $csc)) { throw "Framework C# compiler not found at $csc" }
          $named = Join-Path $env:RUNNER_TEMP "NexaPOS-Setup-$version.exe"
          $outArg = "/out:$named"
          $manifestArg = "/win32manifest:windows\setup\app.manifest"
          $resourceArg = "/resource:$env:RUNTIME_ZIP,NexaPOS-Windows-runtime.zip"
          & $csc /nologo /target:winexe /optimize+ $outArg `
            $manifestArg `
            $resourceArg `
            /reference:System.Windows.Forms.dll `
            /reference:System.IO.Compression.dll `
            /reference:System.IO.Compression.FileSystem.dll `
            /reference:Microsoft.CSharp.dll `
            windows\setup\Program.cs "$assemblyInfo"
          if ($LASTEXITCODE -ne 0) { throw "Installer compile failed with exit code $LASTEXITCODE." }
          & $named /verify-payload
          if ($LASTEXITCODE -ne 0) { throw "Installer payload verification failed with exit code $LASTEXITCODE." }
          $size = (Get-Item $named).Length
          if ($size -gt 25MB) { throw "Installer is $size bytes; expected compact Worker-hosted package below 25 MiB." }
          Write-Host "Compact installer size: $size bytes"
          Write-Host "Windows installer SHA256: $((Get-FileHash $named -Algorithm SHA256).Hash.ToLowerInvariant())"
          "WINDOWS_SETUP=$named" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: NexaPOS-Windows-${{ needs.metadata.outputs.version }}
          path: ${{ env.WINDOWS_SETUP }}
          if-no-files-found: error


  windows-legacy-release:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter config --enable-windows-desktop

      - name: Disable Windows Hello plugin for legacy edition
        shell: pwsh
        run: |
          $registrant = 'windows\flutter\generated_plugin_registrant.cc'
          $text = Get-Content $registrant -Raw
          $text = $text -replace '(?m)^#include <local_auth_windows/local_auth_plugin\.h>\r?\n', ''
          $text = $text -replace '(?ms)^\s*LocalAuthPluginRegisterWithRegistrar\(\r?\n\s*registry->GetRegistrarForPlugin\("LocalAuthPlugin"\)\);\r?\n', ''
          Set-Content -Path $registrant -Value $text -Encoding utf8

          $plugins = 'windows\flutter\generated_plugins.cmake'
          $text = Get-Content $plugins -Raw
          $text = $text -replace '(?m)^\s*local_auth_windows\r?\n', ''
          Set-Content -Path $plugins -Value $text -Encoding utf8

          if (Select-String -Path $registrant,$plugins -Pattern 'local_auth_windows|LocalAuthPlugin' -Quiet) {
            throw 'Windows Hello plugin is still registered in the legacy build.'
          }

      - name: Build Windows 7/8 release
        shell: pwsh
        run: flutter build windows --release --no-pub --dart-define=NEXAPOS_LEGACY_WINDOWS=true
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      - name: Restore verified Windows 7-compatible Flutter engine
        shell: pwsh
        run: |
          $legacySetup = Join-Path $env:RUNNER_TEMP 'NexaPOS-Setup-Windows7-8-1.0.52.exe'
          Invoke-WebRequest -Uri 'https://nexapos-downloads.condojuniur.workers.dev/NexaPOS-Setup-Windows7-8-1.0.52.exe' -OutFile $legacySetup

          $expected = '777b44767eaa09cd2e847c6723d86faebdf57cf833422c95925dbd99680b7991'
          $actual = (Get-FileHash $legacySetup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Published 1.0.52 legacy installer hash mismatch: $actual"
          }

          $assembly = [System.Reflection.Assembly]::LoadFile($legacySetup)
          $resourceNames = @($assembly.GetManifestResourceNames())
          Write-Host "Verified 1.0.52 installer resources: $($resourceNames -join ', ')"
          if ($resourceNames.Count -ne 1 -or $resourceNames[0] -ne 'NexaPOS.LegacyPayload.bin') {
            throw "Unexpected verified legacy installer resources: $($resourceNames -join ', ')"
          }
          $resourceName = $resourceNames[0]

          $payloadFile = Join-Path $env:RUNNER_TEMP 'legacy-1.0.52-payload.bin'
          $stream = $assembly.GetManifestResourceStream($resourceName)
          if ($null -eq $stream) { throw 'Could not open the verified legacy runtime resource.' }
          try {
            $target = [System.IO.File]::Create($payloadFile)
            try { $stream.CopyTo($target) } finally { $target.Dispose() }
          } finally { $stream.Dispose() }

          $oldRuntime = Join-Path $env:RUNNER_TEMP 'legacy-1.0.52-runtime'
          [System.IO.Directory]::CreateDirectory($oldRuntime) | Out-Null
          $inputFile = [System.IO.File]::OpenRead($payloadFile)
          $reader = [System.IO.BinaryReader]::new($inputFile)
          try {
            $magic = [System.Text.Encoding]::ASCII.GetString($reader.ReadBytes(6))
            if ($magic.Length -ne 6 -or !$magic.StartsWith('NXPK1') -or [int][char]$magic[5] -ne 0) { throw 'Unexpected legacy payload magic.' }
            $count = $reader.ReadInt32()
            if ($count -ne 21) { throw "Expected 21 legacy runtime files; found $count." }
            for ($entry = 0; $entry -lt $count; $entry++) {
              $nameLength = $reader.ReadInt32()
              if ($nameLength -lt 1 -or $nameLength -gt 4096) { throw "Invalid name length $nameLength." }
              $nameBytes = $reader.ReadBytes($nameLength)
              if ($nameBytes.Length -ne $nameLength) { throw "Truncated entry name $entry." }
              $name = [System.Text.Encoding]::UTF8.GetString($nameBytes)
              $originalLength = $reader.ReadInt64()
              $storedLength = $reader.ReadInt64()
              $method = $reader.ReadByte()
              $expectedDigest = $reader.ReadBytes(32)
              if ($expectedDigest.Length -ne 32) { throw "Truncated digest for $name." }
              if ($originalLength -lt 0 -or $originalLength -gt 500MB -or $storedLength -lt 0 -or $storedLength -gt 500MB) {
                throw "Invalid payload lengths for $name."
              }
              $stored = $reader.ReadBytes([int]$storedLength)
              if ($stored.Length -ne $storedLength) { throw "Truncated payload for $name." }
              $destination = [System.IO.Path]::GetFullPath((Join-Path $oldRuntime $name))
              if (!$destination.StartsWith($oldRuntime + [System.IO.Path]::DirectorySeparatorChar, [System.StringComparison]::OrdinalIgnoreCase)) {
                throw "Unsafe legacy payload path $name."
              }
              [System.IO.Directory]::CreateDirectory([System.IO.Path]::GetDirectoryName($destination)) | Out-Null
              if ($method -eq 0) {
                [System.IO.File]::WriteAllBytes($destination, $stored)
              } elseif ($method -eq 1) {
                $compressed = [System.IO.MemoryStream]::new($stored, $false)
                try {
                  $inflater = [System.IO.Compression.DeflateStream]::new($compressed, [System.IO.Compression.CompressionMode]::Decompress)
                  try {
                    $outputFile = [System.IO.File]::Create($destination)
                    try { $inflater.CopyTo($outputFile) } finally { $outputFile.Dispose() }
                  } finally { $inflater.Dispose() }
                } finally { $compressed.Dispose() }
              } else {
                throw "Unsupported compression method $method for $name."
              }
              $actualLength = (Get-Item $destination).Length
              if ($actualLength -ne $originalLength) { throw "Incorrect decoded length for $name ($actualLength vs $originalLength)." }
              $actualDigest = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
              $expectedHex = [System.BitConverter]::ToString($expectedDigest).Replace('-', '').ToLowerInvariant()
              if ($actualDigest -ne $expectedHex) { throw "Digest mismatch for $name." }
              Write-Host "Recovered $name ($actualLength bytes, method $method)"
            }
            if ($inputFile.Position -ne $inputFile.Length) { throw "Unexpected trailing bytes in legacy payload." }
          } finally { $reader.Dispose(); $inputFile.Dispose() }
          $patchedEngine = Join-Path $oldRuntime 'flutter_windows.dll'
          if (!(Test-Path $patchedEngine)) {
            throw 'Verified 1.0.52 legacy runtime did not contain flutter_windows.dll.'
          }

          $newRuntime = 'build\windows\x64\runner\Release'
          $repairedRuntime = Join-Path $env:RUNNER_TEMP 'legacy-1.0.53-repaired-runtime'
          [System.IO.Directory]::CreateDirectory($repairedRuntime) | Out-Null
          Copy-Item (Join-Path $oldRuntime '*') $repairedRuntime -Recurse -Force

          # Keep the complete 1.0.52 Win7-compatible native runner and plugins.
          # The earlier 1.0.53 package only restored flutter_windows.dll, while
          # its newly built runner/plugins exit silently on actual Windows 7.
          Copy-Item (Join-Path $newRuntime 'data\app.so') (Join-Path $repairedRuntime 'data\app.so') -Force
          Remove-Item (Join-Path $repairedRuntime 'data\flutter_assets') -Recurse -Force
          Copy-Item (Join-Path $newRuntime 'data\flutter_assets') (Join-Path $repairedRuntime 'data\flutter_assets') -Recurse -Force
          python release-tools/patch_legacy_runner_version.py (Join-Path $repairedRuntime 'nexapos_mobile.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Could not patch legacy runner version.' }

          foreach ($native in @('flutter_windows.dll','dartjni.dll','file_selector_windows_plugin.dll',
              'flutter_secure_storage_windows_plugin.dll','printing_plugin.dll','url_launcher_windows_plugin.dll')) {
            $expectedNative = (Get-FileHash (Join-Path $oldRuntime $native) -Algorithm SHA256).Hash
            $actualNative = (Get-FileHash (Join-Path $repairedRuntime $native) -Algorithm SHA256).Hash
            if ($actualNative -ne $expectedNative) { throw "Win7 native component changed: $native" }
          }
          if (Test-Path (Join-Path $repairedRuntime 'local_auth_windows_plugin.dll')) {
            throw 'Legacy runtime unexpectedly contains local_auth_windows_plugin.dll.'
          }
          $oldApp = (Get-FileHash (Join-Path $oldRuntime 'data\app.so') -Algorithm SHA256).Hash
          $newApp = (Get-FileHash (Join-Path $newRuntime 'data\app.so') -Algorithm SHA256).Hash
          $repairedApp = (Get-FileHash (Join-Path $repairedRuntime 'data\app.so') -Algorithm SHA256).Hash
          if ($repairedApp -ne $newApp -or $repairedApp -eq $oldApp) {
            throw 'The repaired runtime does not contain the new application code.'
          }
          $files = @(Get-ChildItem $repairedRuntime -File -Recurse)
          Write-Host "Repaired Win7 runtime files: $($files.Count)"
          Write-Host "Known-good engine SHA256: $((Get-FileHash (Join-Path $repairedRuntime 'flutter_windows.dll') -Algorithm SHA256).Hash.ToLowerInvariant())"
          "REPAIRED_LEGACY_RUNTIME=$repairedRuntime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package legacy Windows runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'NexaPOS-Windows7-8-runtime.zip'
          Compress-Archive -Path (Join-Path $env:REPAIRED_LEGACY_RUNTIME '*') -DestinationPath $runtime -Force
          "LEGACY_RUNTIME_ZIP=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build compact Windows 7/8 installer
        shell: pwsh
        run: |
          $version = "${{ needs.metadata.outputs.version }}"
          $parts = $version.Split('.')
          $assemblyVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          $assemblyInfo = Join-Path $env:RUNNER_TEMP 'SetupVersionLegacy.cs'
          @"
          using System.Reflection;
          [assembly: AssemblyVersion("$assemblyVersion")]
          [assembly: AssemblyFileVersion("$assemblyVersion")]
          "@ | Set-Content -Path $assemblyInfo -Encoding ascii

          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (!(Test-Path $csc)) { throw "Framework C# compiler not found at $csc" }
          $named = Join-Path $env:RUNNER_TEMP "NexaPOS-Setup-Windows7-8-$version.exe"
          $compilerArgs = @(
            '/nologo',
            '/target:winexe',
            '/optimize+',
            "/out:$named",
            '/win32manifest:windows\setup\app.manifest',
            "/resource:$env:LEGACY_RUNTIME_ZIP,NexaPOS-Windows-runtime.zip",
            '/reference:System.Windows.Forms.dll',
            '/reference:System.IO.Compression.dll',
            '/reference:System.IO.Compression.FileSystem.dll',
            '/reference:Microsoft.CSharp.dll',
            'windows\setup\Program.cs',
            $assemblyInfo
          )
          & $csc @compilerArgs
          if ($LASTEXITCODE -ne 0) { throw "Legacy installer compile failed with exit code $LASTEXITCODE." }

          & $named /verify-payload
          if ($LASTEXITCODE -ne 0) { throw "Legacy installer payload verification failed with exit code $LASTEXITCODE." }

          $size = (Get-Item $named).Length
          if ($size -gt 25MB) {
            throw "Legacy installer is $size bytes; expected compact Worker-hosted package below 25 MiB."
          }
          Write-Host "Compact legacy installer size: $size bytes"
          Write-Host "Legacy installer SHA256: $((Get-FileHash $named -Algorithm SHA256).Hash.ToLowerInvariant())"
          "WINDOWS_LEGACY_SETUP=$named" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: NexaPOS-Windows7-8-${{ needs.metadata.outputs.version }}
          path: ${{ env.WINDOWS_LEGACY_SETUP }}
          if-no-files-found: error

  publish-github-release:
    if: github.ref == 'refs/heads/nexapos-1.0.12-safety'
    needs:
      - metadata
      - android-release
      - windows-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: NexaPOS-Android-${{ needs.metadata.outputs.version }}
          path: artifacts/android

      - uses: actions/download-artifact@v4
        with:
          name: NexaPOS-Windows-${{ needs.metadata.outputs.version }}
          path: artifacts/windows

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.metadata.outputs.version }}"
          mkdir -p release
          cp artifacts/android/app-release.apk "release/NexaPOS-$VERSION.apk"
          cp "artifacts/windows/NexaPOS-Setup-$VERSION.exe" "release/NexaPOS-Setup-$VERSION.exe"
          sha256sum "release/NexaPOS-$VERSION.apk" "release/NexaPOS-Setup-$VERSION.exe" > "release/SHA256SUMS-$VERSION.txt"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.metadata.outputs.version }}"
          TAG="v$VERSION"
          NOTES="docs/release-$VERSION.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "NexaPOS $VERSION" --notes-file "$NOTES"
          fi
