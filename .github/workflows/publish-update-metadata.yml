name: Verify update release assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version and public URLs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml | head -n 1)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_URL=https://pub-2a7877d5b6bf40a18da4c1d6ed977081.r2.dev/NexaPOS-$VERSION.apk" >> "$GITHUB_ENV"
          echo "WINDOWS_URL=https://nexapos-downloads.condojuniur.workers.dev/NexaPOS-Setup-$VERSION.exe" >> "$GITHUB_ENV"
          echo "WINDOWS_LEGACY_URL=https://nexapos-downloads.condojuniur.workers.dev/NexaPOS-Setup-Windows7-8-$VERSION.exe" >> "$GITHUB_ENV"

      - name: Verify hosted release files and print SHA-256
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$ANDROID_URL" -o android.apk
          curl --fail --location --silent --show-error "$WINDOWS_URL" -o windows.exe
          curl --fail --location --silent --show-error "$WINDOWS_LEGACY_URL" -o windows-legacy.exe

          echo "Android:        $(wc -c < android.apk) bytes  $(sha256sum android.apk | awk '{print $1}')"
          echo "Windows:        $(wc -c < windows.exe) bytes  $(sha256sum windows.exe | awk '{print $1}')"
          echo "Windows legacy: $(wc -c < windows-legacy.exe) bytes  $(sha256sum windows-legacy.exe | awk '{print $1}')"

      - name: Confirm license server is read-only in this workflow
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             'https://license.nexapos.cc/index.php?action=latest_version'             -o latest.json
          python - <<'PY'
          import json
          data=json.load(open("latest.json", encoding="utf-8"))
          print("Current announced version:", data.get("version"))
          print("This workflow does not publish or call set_latest_version.")
          PY
